name: Weekly Trello Task Audit Sync

on:
  schedule:
    # Runs every Sunday at 16:00 UTC (12:00 AM PHT Monday)
    - cron: '0 16 * * 0'
  workflow_dispatch:

jobs:
  sync-trello:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Trello Sync
        env:
          TRELLO_API_KEY: ${{ secrets.TRELLO_API_KEY }}
          TRELLO_TOKEN: ${{ secrets.TRELLO_TOKEN }}
          TRELLO_BOARD_ID: ${{ secrets.TRELLO_BOARD_ID }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT_OR_TOKEN }}
        run: python src/sync_weekly.py
